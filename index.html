<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoHunt PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .compass-arrow {
            transition: transform 0.1s linear;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <nav class="bg-slate-800/80 backdrop-blur-md sticky top-0 z-50 p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-2xl font-black text-emerald-400 cursor-pointer" onclick="showScreen('home')">
            GeoHunt <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded">PRO</span>
        </h1>
        <div class="flex space-x-2">
            <button onclick="showScreen('home')" class="px-3 py-1.5 bg-slate-700 rounded-lg text-sm font-semibold">Početna</button>
            <button onclick="showScreen('editor')" class="px-3 py-1.5 bg-emerald-500 text-slate-950 font-black rounded-lg text-sm">Editor (+)</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-xl flex-1 flex flex-col justify-center">

        <!-- 1. POČETNI EKRAN -->
        <div id="screen-home" class="space-y-6 text-center py-6 my-auto">
            <div class="space-y-2">
                <span class="text-5xl">🧭</span>
                <h2 class="text-3xl font-black">GeoHunt PRO</h2>
                <p class="text-slate-400 text-sm">Unesite ID avanture ili uvezite kod avanture stvoren na PC-u!</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase text-left mb-1">ID ili Kod Avanture</label>
                    <input type="text" id="game-id-input" placeholder="Upišite ID (npr. GH-1234) ili zalijepite kod" class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-700 text-white text-center font-mono focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="loadGame()" class="w-full bg-emerald-500 text-slate-950 font-black py-3.5 rounded-xl text-lg">Započni Igru 🚀</button>
            </div>
        </div>

        <!-- 2. EDITOR EKRAN -->
        <div id="screen-editor" class="hidden space-y-5 py-4">
            <h2 class="text-2xl font-black text-emerald-400">Editor Avanture</h2>
            
            <div class="bg-slate-800 p-5 rounded-2xl space-y-4 border border-slate-700">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Naziv Avanture</label>
                    <input type="text" id="hunt-title" placeholder="Npr. Potraga za Blagom" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tip Koraka</label>
                    <select id="step-type" onchange="toggleEditorFields()" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white">
                        <option value="location">Tajno Odredište (Kompas + Udaljenost)</option>
                        <option value="quiz-mc">Pitanje s ponuđenim odgovorima</option>
                        <option value="quiz-open">Pitanje otvorenog tipa</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tekst / Pitanje / Uputa</label>
                    <textarea id="step-text" placeholder="Unesite tekst..." class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white h-20"></textarea>
                </div>

                <div id="field-points" class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl">
                    <label class="block text-xs font-bold text-amber-400 uppercase mb-1">⭐ Bodovi za ovaj korak</label>
                    <input type="number" id="step-points" value="10" min="0" class="w-full p-2 rounded-lg bg-slate-950 text-white text-center font-bold">
                </div>

                <!-- Polja za Lokaciju -->
                <div id="field-location" class="space-y-2 border-l-2 border-emerald-500 pl-3">
                    <p class="text-xs text-emerald-400">Koordinate cilja:</p>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="any" id="step-lat" placeholder="Lat (npr. 45.815)" class="p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm">
                        <input type="number" step="any" id="step-lng" placeholder="Lng (npr. 15.981)" class="p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm">
                    </div>
                </div>

                <!-- Polja za Višestruki Izbor -->
                <div id="field-quiz-mc" class="hidden space-y-2 border-l-2 border-emerald-500 pl-3">
                    <input type="text" id="mc-1" placeholder="Opcija A" class="w-full p-2 rounded-lg bg-slate-950 text-sm">
                    <input type="text" id="mc-2" placeholder="Opcija B" class="w-full p-2 rounded-lg bg-slate-950 text-sm">
                    <input type="text" id="mc-3" placeholder="Opcija C" class="w-full p-2 rounded-lg bg-slate-950 text-sm">
                    <select id="mc-correct" class="w-full p-2 rounded-lg bg-slate-950 text-sm">
                        <option value="0">Točan odgovor: Opcija A</option>
                        <option value="1">Točan odgovor: Opcija B</option>
                        <option value="2">Točan odgovor: Opcija C</option>
                    </select>
                </div>

                <!-- Polja za Otvoreno Pitanje -->
                <div id="field-quiz-open" class="hidden border-l-2 border-emerald-500 pl-3">
                    <input type="text" id="open-answer" placeholder="Točna riječ/odgovor" class="w-full p-2 rounded-lg bg-slate-950 text-sm">
                </div>

                <button onclick="addStep()" class="w-full bg-slate-700 text-white font-bold py-2.5 rounded-xl">+ Dodaj Korak</button>
            </div>

            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <ul id="editor-steps-list" class="space-y-2 text-sm text-slate-300"></ul>
            </div>

            <button onclick="publishHunt()" class="w-full bg-emerald-500 text-slate-950 font-black py-4 rounded-2xl text-lg">Objavi Avanturu 🎯</button>
        </div>

        <!-- 3. GAMEPLAY EKRAN -->
        <div id="screen-game" class="hidden space-y-5 my-auto">
            <div class="flex justify-between items-center bg-slate-800 p-3.5 rounded-2xl border border-slate-700">
                <span id="game-title-display" class="font-black text-emerald-400"></span>
                <div class="flex space-x-2">
                    <span id="score-display" class="text-xs bg-amber-500/20 text-amber-400 font-black px-2.5 py-1 rounded-full">⭐ 0</span>
                    <span id="game-progress" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full font-mono">1/1</span>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center space-y-5">
                <p id="play-text" class="text-lg font-bold text-slate-100"></p>

                <!-- KOMPAS (BEZ KARTE) -->
                <div id="play-location-container" class="hidden space-y-4">
                    <div class="flex flex-col items-center justify-center p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                        <span class="text-xs font-bold text-slate-400 uppercase">Slijedite Kazaljku</span>
                        
                        <div class="relative w-32 h-32 flex items-center justify-center bg-slate-900 rounded-full border-2 border-emerald-500/30">
                            <div id="compass-arrow" class="compass-arrow text-6xl">🎯</div>
                        </div>

                        <div class="bg-emerald-500/10 border border-emerald-500/30 px-4 py-1.5 rounded-xl">
                            <span id="distance-display" class="text-2xl font-black font-mono text-emerald-400">--- m</span>
                        </div>

                        <button onclick="enableSensors()" class="text-xs text-amber-400 underline pt-2">Aktiviraj Kompas Senzor (iOS/Android)</button>
                    </div>
                </div>

                <div id="play-mc-container" class="hidden space-y-2"></div>

                <div id="play-open-container" class="hidden space-y-3">
                    <input type="text" id="open-input" placeholder="Odgovor..." class="w-full p-3 rounded-xl bg-slate-950 text-center text-lg border border-slate-700">
                    <button onclick="checkOpenAnswer()" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">Potvrdi Odgovor</button>
                </div>

                <button id="next-btn" onclick="nextStep()" class="hidden w-full bg-emerald-500 text-slate-950 font-black py-3.5 rounded-xl text-lg">Dalje ➡️</button>
            </div>
        </div>

    </main>

    <script>
        let currentHunt = { id: '', title: '', steps: [] };
        let tempSteps = [];
        let currentStepIndex = 0;
        let totalScore = 0;
        let userLat = null, userLng = null;
        let deviceHeading = 0;

        function showScreen(screen) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-editor').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById(`screen-${screen}`).classList.remove('hidden');
        }

        function toggleEditorFields() {
            const type = document.getElementById('step-type').value;
            document.getElementById('field-location').classList.add('hidden');
            document.getElementById('field-quiz-mc').classList.add('hidden');
            document.getElementById('field-quiz-open').classList.add('hidden');
            if (type === 'location') document.getElementById('field-location').classList.remove('hidden');
            if (type === 'quiz-mc') document.getElementById('field-quiz-mc').classList.remove('hidden');
            if (type === 'quiz-open') document.getElementById('field-quiz-open').classList.remove('hidden');
        }

        function addStep() {
            const type = document.getElementById('step-type').value;
            const text = document.getElementById('step-text').value;
            const points = parseInt(document.getElementById('step-points').value) || 0;
            if(!text) return alert('Unesite tekst koraka!');

            let step = { type, text, points };

            if (type === 'location') {
                step.lat = parseFloat(document.getElementById('step-lat').value);
                step.lng = parseFloat(document.getElementById('step-lng').value);
            } else if (type === 'quiz-mc') {
                step.options = [document.getElementById('mc-1').value, document.getElementById('mc-2').value, document.getElementById('mc-3').value];
                step.correct = parseInt(document.getElementById('mc-correct').value);
            } else if (type === 'quiz-open') {
                step.answer = document.getElementById('open-answer').value.trim().toLowerCase();
            }

            tempSteps.push(step);
            updateEditorList();
            document.getElementById('step-text').value = '';
        }

        function updateEditorList() {
            const list = document.getElementById('editor-steps-list');
            list.innerHTML = tempSteps.map((s, i) => `<li class="bg-slate-950 p-2 rounded">${i+1}. [${s.type}] ${s.text} (+${s.points} pt)</li>`).join('');
        }

        function publishHunt() {
            const title = document.getElementById('hunt-title').value.trim();
            if(!title || tempSteps.length === 0) return alert('Popunite naziv i dodajte korake!');

            const huntId = 'GH-' + Math.floor(1000 + Math.random() * 9000);
            const newHunt = { id: huntId, title, steps: tempSteps };
            
            const rawData = JSON.stringify(newHunt);
            localStorage.setItem(huntId, rawData);

            prompt(`🎉 Avantura objavljena!\n\nID: ${huntId}\n\nKopirajte donji kod i zalijepite ga na mobitela u polje za ID:`, rawData);
            tempSteps = [];
            showScreen('home');
        }

        function loadGame() {
            const input = document.getElementById('game-id-input').value.trim();
            if(!input) return alert('Unesite ID ili Kod!');

            let data = localStorage.getItem(input);
            if(!data && input.startsWith('{')) {
                data = input; // Ako je zalijepljen cijeli kod avanture
            }

            if(!data) return alert('Avantura nije pronađena! Zalijepite kod avanture stvoren na PC-u.');

            currentHunt = JSON.parse(data);
            currentStepIndex = 0;
            totalScore = 0;
            
            document.getElementById('game-title-display').innerText = currentHunt.title;
            document.getElementById('score-display').innerText = `⭐ ${totalScore}`;
            
            showScreen('game');
            renderStep();
            initGPSAndCompass();
        }

        function renderStep() {
            const step = currentHunt.steps[currentStepIndex];
            document.getElementById('play-location-container').classList.add('hidden');
            document.getElementById('play-mc-container').classList.add('hidden');
            document.getElementById('play-open-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            document.getElementById('game-progress').innerText = `${currentStepIndex + 1}/${currentHunt.steps.length}`;
            document.getElementById('play-text').innerText = step.text;

            if(step.type === 'location') {
                document.getElementById('play-location-container').classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else if(step.type === 'quiz-mc') {
                const container = document.getElementById('play-mc-container');
                container.classList.remove('hidden');
                container.innerHTML = step.options.map((opt, idx) => `
                    <button onclick="checkMC(${idx})" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-xl font-bold">${opt}</button>
                `).join('');
            } else if(step.type === 'quiz-open') {
                document.getElementById('play-open-container').classList.remove('hidden');
            }
        }

        function checkMC(idx) {
            const step = currentHunt.steps[currentStepIndex];
            if(idx === step.correct) {
                totalScore += step.points;
                document.getElementById('score-display').innerText = `⭐ ${totalScore}`;
                alert(`🎯 Točno! +${step.points} pt`);
                document.getElementById('play-mc-container').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else alert('❌ Netočno!');
        }

        function checkOpenAnswer() {
            const step = currentHunt.steps[currentStepIndex];
            const input = document.getElementById('open-input').value.trim().toLowerCase();
            if(input === step.answer) {
                totalScore += step.points;
                document.getElementById('score-display').innerText = `⭐ ${totalScore}`;
                alert(`🎯 Točno! +${step.points} pt`);
                document.getElementById('play-open-container').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else alert('❌ Netočno!');
        }

        function nextStep() {
            currentStepIndex++;
            if(currentStepIndex < currentHunt.steps.length) renderStep();
            else {
                alert(`🏆 ČESTITAMO! Završili ste avanturu sa ${totalScore} bodova!`);
                showScreen('home');
            }
        }

        // --- GEOLOKACIJA & KOMPAS SENZORI ---
        function initGPSAndCompass() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    updateCompassUI();
                }, null, { enableHighAccuracy: true });
            }

            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        function enableSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    }
                });
            }
        }

        function handleOrientation(e) {
            if (e.webkitCompassHeading) {
                deviceHeading = e.webkitCompassHeading; // iOS
            } else if (e.alpha !== null) {
                deviceHeading = 360 - e.alpha; // Android
            }
            updateCompassUI();
        }

        function updateCompassUI() {
            const step = currentHunt.steps[currentStepIndex];
            if(!step || step.type !== 'location' || !userLat || !userLng) return;

            const dist = getDistance(userLat, userLng, step.lat, step.lng);
            document.getElementById('distance-display').innerText = `${Math.round(dist)} m`;

            const targetBearing = getBearing(userLat, userLng, step.lat, step.lng);
            
            // Kut kazaljke = Azimut cilja - Orijentacija mobitela
            const arrowAngle = targetBearing - deviceHeading;
            document.getElementById('compass-arrow').style.transform = `rotate(${arrowAngle}deg)`;
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2-lon1)*Math.PI/180) * Math.cos(lat2*Math.PI/180);
            const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
